name: SemlaFlow
hf_id: N/A
license: MIT
task: 3D molecular structure generation (flow matching)
domain: healthcare
upstream_code: https://github.com/rssrwn/semla-flow
paper: null
weight_source: Google Drive (see upstream repo for download links)
container_image: rocm/pytorch:rocm6.4.1_ubuntu24.04_py3.12_pytorch_release_2.6.0
vram_gb: null
validated_hardware: []

disclaimer: >
  Research / engineering use only. Not medical advice.
  Must not be used with patient-identifiable data or PHI.

recipes:
  - task: inference
    description: Generate 3D molecular structures on QM9 or GEOM-Drugs
    recipe_path: recipes/inference/
    script: examples/run_inference.sh

env_vars:
  CHECKPOINT:
    description: Path to pretrained .ckpt file
    required: true
    default: null
  DATASET:
    description: Target dataset (qm9 or drugs)
    required: false
    default: drugs
  OUTPUT_FILE:
    description: Output SDF file path
    required: false
    default: /workspace/generated.sdf
  NUM_STEPS:
    description: ODE integration steps (minimum 20 recommended)
    required: false
    default: "20"
  USE_COMPILE:
    description: Enable torch.compile (1=on)
    required: false
    default: "1"
  NO_EMA:
    description: Disable EMA for faster inference (1=on)
    required: false
    default: "1"
