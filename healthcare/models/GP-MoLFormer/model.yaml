name: GP-MoLFormer
hf_id: ibm-research/GP-MoLFormer-Uniq
license: Apache-2.0
task: SMILES molecule generation (unconditional, scaffold-constrained, pair-tuning)
domain: healthcare
upstream_code: https://github.com/IBM/gp-molformer
paper: https://arxiv.org/abs/2302.07432
container_image:
  - rocm/pytorch:rocm7.0_ubuntu22.04_py3.10_pytorch_release_2.7.1
  - rocm/pytorch:rocm7.2.2_ubuntu24.04_py3.12_pytorch_release_2.10.0
vram_gb: null
validated_hardware:
  - MI300X
  - MI300A

disclaimer: >
  Research / engineering use only. Not medical advice.
  Must not be used with patient-identifiable data or PHI.

recipes:
  - task: inference
    description: Unconditional or scaffold-constrained SMILES generation
    recipe_path: recipes/inference/
    script: examples/run_generation.sh
    slurm: examples/sbatch_inference_amd.sh
  - task: finetune
    description: Pair-tuning for property optimization
    recipe_path: recipes/finetune/
    script: examples/run_pairtune.sh

env_vars:
  GPMOL_SIF:
    description: Path to Apptainer SIF file
    required: true
    default: null
  SCAFFOLD:
    description: SMILES fragment for constrained generation (empty = unconditional)
    required: false
    default: null
  NUM_BATCHES:
    description: Batches of 1000 molecules
    required: false
    default: "1"
  OUTPUT_FILE:
    description: Output CSV path
    required: false
    default: /workspace/generated.csv
