name: HydraGNN (Predictive GFM 2024)
hf_id: mlupopa/HydraGNN_Predictive_GFM_2024
license: BSD-3-Clause-Clear
task: Ensemble of predictive graph foundation models for atomistic materials (energy + forces)
domain: material_science
upstream_code: https://github.com/ORNL/HydraGNN
upstream_branch: Predictive_GFM_2024
paper: null
container_image: rocm/pytorch:rocm7.2.2_ubuntu24.04_py3.12_pytorch_release_2.10.0
vram_gb: null
validated_hardware:
  - MI355X (gfx950)

data_format: ADIOS (HDF5-based)
data_source: https://doi.ccs.ornl.gov/dataset/3a49c8df-83f7-5d32-84be-f81d289e7cdd

recipes:
  - task: inference
    description: Load checkpoints and run predictions with the GFM ensemble
    recipe_path: recipes/inference/
    script: examples/run_inference.sh
    sbatch_script: examples/sbatch_infer_amd.sh
  - task: train
    description: Multi-dataset GFM training with ANI1x and Alexandria (multi-node)
    recipe_path: recipes/train/
    script: examples/run_train.sh
    sbatch_script: examples/sbatch_train_amd.sh
  - task: train-omnihub
    description: Multi-node GFM training via OmniHub job generator (sync + generate-job.sh)
    recipe_path: integrations/omnihub/applications/hydragnn-train/
    script: integrations/omnihub/README.md
  - task: perf-analysis-omnihub
    description: 2-node perf run via OmniHub (omnistat + pytorch-trace + tracelens); read processed-data/ for agents
    recipe_path: integrations/omnihub/applications/hydragnn-train/
    script: integrations/omnihub/README.md
  - task: perf-analysis
    description: 2-node bottleneck analysis with TraceLens + Omnistat (user-mode) via paired analyst/verifier subagents
    recipe_path: recipes/perf-analysis/
    sbatch_script: examples/sbatch_train_perf_amd.sh
  - task: perf-optimizer-loop
    description: Iterative systems optimizer; 3-5 iter loop over the perf-analysis pipeline, picks one lever per iter, auto-revert on regression, writes story.md + foms.png
    recipe_path: recipes/perf-optimizer-loop/
    script: examples/run_optimizer_loop.sh
    sbatch_script: examples/sbatch_train_perf_amd.sh

env_vars:
  # Required for HPC scripts (sbatch_*_amd.sh, build_overlay_amd.sh)
  AI4S_SHARED_DIR:
    description: Base path for shared assets (SIF, overlays, datasets, code)
    required: true
    default: null
  # Inference task
  HG_CHECKPOINT:
    description: Path to .pk checkpoint file (inference)
    required: true
    default: null
  HG_CONFIG:
    description: Matching config.json for the checkpoint (inference)
    required: true
    default: null
  # Training task
  HG_DATASETS:
    description: Comma-separated dataset names for training
    required: false
    default: ANI1x,Alexandria
  HG_DATA_DIR:
    description: Directory containing <name>-v2.bp ADIOS dataset dirs
    required: false
    default: null
  HG_BATCH_SIZE:
    description: Per-rank batch size (overrides config)
    required: false
    default: null
  HG_NUM_EPOCH:
    description: Number of training epochs (overrides config)
    required: false
    default: null
  HG_PRECISION:
    description: Training precision (fp32, fp64, bf16)
    required: false
    default: fp64
  # Shared
  HG_OUTPUT_DIR:
    description: Output/working directory
    required: false
    default: null
  HG_REPO_DIR:
    description: HydraGNN source clone location (training, pinned SHA)
    required: false
    default: null
  HG_INFER_REPO:
    description: HydraGNN Predictive_GFM_2024 branch clone (inference only)
    required: false
    default: null
