# HydraGNN perf-optimizer-loop — lever catalog
#
# Each entry describes ONE atomic change the orchestrator may apply between
# iterations. Levers are tried in `catalog_order` priority. After an iteration
# the lever id is recorded in `foms.csv`; if it regressed the primary FOM
# (epoch_time_s), the lever id is appended to `do_not_retry.json` and the
# orchestrator restores the previous-best config.
#
# Schema:
#   id              str  unique short id (used in foms.csv and do_not_retry.json)
#   description     str  one-line human description
#   catalog_order   int  smaller = tried earlier; baseline=0
#   kind            str  env_only | rank_script_patch | diagnostic
#   env_vars        map  vars to add/change to the sbatch submission (override)
#   rank_script_patch  str (optional) — single line of python that wraps the model
#                       construction in the rank script. Only used when kind=rank_script_patch.
#                       Applied via HG_RANK_PRE_TRAIN_HOOK env var (orchestrator writes
#                       a small python file and bind-mounts it; the rank script invokes
#                       runpy on the hook before train_validate_test()).
#   diagnostic_only bool — when true, FOM accept/reject is skipped; counts against budget
#   expected_payoff str  qualitative ("high"|"medium"|"low") — used by lever_picker for ranking
#   risk            str  ("low"|"medium"|"high") — used by lever_picker
#   revert_method   str  ("drop_env"|"drop_hook") — how the orchestrator undoes the change
#   citation        url  source for the recommendation (ROCm blog/doc, or "local")
#   notes           str  any caveats the lever_picker should consider

levers:

  - id: baseline
    description: "Baseline run with current R2 defaults (HG_BATCH_SIZE=400, fp64, persistent_workers=1, num_workers=8). Must be iter-0."
    catalog_order: 0
    kind: env_only
    env_vars:
      HG_BATCH_SIZE: "400"
      HG_PRECISION: "fp64"
      HYDRAGNN_NUM_WORKERS: "8"
      HYDRAGNN_PERSISTENT_WORKERS: "1"
      HG_NUM_EPOCH: "3"
      HYDRAGNN_MAX_NUM_BATCH: "50"
      PROFILE_TARGET_EPOCH: "2"
    diagnostic_only: false
    expected_payoff: "n/a (baseline)"
    risk: "low"
    revert_method: "drop_env"
    citation: "/shared/aaji/models/HydraGNN/perf-runs/6985/combined_report.md"
    notes: "Reference state. Establishes the FOM denominator for all subsequent iters."

  - id: batch_800
    description: "Double batch size: HG_BATCH_SIZE 400 -> 800. R2 #1 next-lever recommendation; VRAM headroom is 24/288 GB."
    catalog_order: 1
    kind: env_only
    env_vars:
      HG_BATCH_SIZE: "800"
    diagnostic_only: false
    expected_payoff: "high"
    risk: "low"
    revert_method: "drop_env"
    citation: "/shared/aaji/models/HydraGNN/perf-runs/6985/combined_report.md"
    notes: "R2 showed 200->400 gave +1.80x util and +2.41x MFMA. Diminishing returns expected; if delta < 30%, move on."

  - id: torch_compile_e3nn
    description: "BLOCKED — torch.compile is fundamentally incompatible with HydraGNN GFM-MLIP under PyTorch 2.10 / ROCm 7.2.2. Documented here so the lever_picker NEVER re-tries it."
    catalog_order: 2
    kind: rank_script_patch
    status: "blocked"
    blocked_reason: "AOT-Autograd-double-backward"
    blocked_evidence: "compile-investigation-aa480554 (2026-05-23): 6 hooks across 3 hypotheses, all fail with same root cause."
    env_vars:
      HG_TORCH_COMPILE: "1"
      HG_TORCH_COMPILE_MODE: "reduce-overhead"
    rank_script_patch: |
      # KNOWN-BROKEN — kept for reference only. Do NOT enable this lever.
      #
      # Root cause: HydraGNN's energy_force_loss (hydragnn/models/create.py:718)
      # calls torch.autograd.grad(graph_energy_pred, data.pos, create_graph=True).
      # With create_graph=True, training requires DOUBLE BACKWARD
      # (loss.backward differentiates through forces, which themselves came
      # from autograd.grad over the forward). PyTorch's AOT Autograd — used
      # by every torch.compile mode (default, reduce-overhead, max-autotune) —
      # pre-compiles the backward as a joint program and cannot itself be
      # differentiated. Verbatim error (every rank):
      #   RuntimeError: torch.compile with aot_autograd does not currently
      #   support double backward
      #     at torch/_functorch/_aot_autograd/runtime_wrappers.py:2356
      #
      # Strategies tested and rejected in compile-investigation-aa480554:
      #   H1 — compile inner self.model (MACEStack) only → AOT boundary
      #        severs data.pos lineage → "differentiated Tensors appears
      #        not to have been used in the graph"
      #   H2 — outer compile + dynamo.allow_in_graph(autograd.grad)
      #        (the MACE upstream pattern) → allow_in_graph only prevents
      #        dynamo from tracing THROUGH the call; FakeTensor symbolic
      #        execution still runs autograd.grad and fails
      #   H3 — compile only one RealAgnosticAttResidualInteractionBlock
      #        submodule → still triggers AOT for that submodule's
      #        backward → same double-backward error
      #
      # To unblock requires upstream HydraGNN source change: move
      # energy_force_loss INTO EnhancedModelWrapper.forward so the
      # autograd.grad call is inside the compiled forward, mirroring the
      # canonical MACE/Allegro/NequIP pattern. ~30-50 LOC across
      # hydragnn/models/create.py:622-758 and
      # hydragnn/train/train_validate_test.py:725-735. Config-gated to
      # preserve non-MLIP HydraGNN paths.
      raise RuntimeError("torch_compile_e3nn is BLOCKED for HydraGNN MLIP; see lever_catalog.yaml")
    diagnostic_only: false
    expected_payoff: "none (blocked)"
    risk: "blocked"
    revert_method: "drop_hook"
    citation: "/shared/aaji/models/HydraGNN/perf-runs/compile-investigation-aa480554-2a15-4e04-80dd-c58afc672a8d/INVESTIGATION_REPORT.md"
    notes: "DO NOT pick this lever until HydraGNN upstream patches energy_force_loss into forward(). The lever_picker subagent must treat status:blocked as equivalent to do_not_retry."

  - id: rccl_high_priority
    description: "RCCL stream priority and HIP hardware queue count: TORCH_NCCL_HIGH_PRIORITY=1, GPU_MAX_HW_QUEUES=2. Improves compute<->RCCL overlap."
    catalog_order: 3
    kind: env_only
    env_vars:
      TORCH_NCCL_HIGH_PRIORITY: "1"
      GPU_MAX_HW_QUEUES: "2"
    diagnostic_only: false
    expected_payoff: "medium"
    risk: "low"
    revert_method: "drop_env"
    citation: "https://rocm.docs.amd.com/en/latest/how-to/tuning-guides/mi300x/workload.html"
    notes: "R2 already showed exposed NCCL was only 3% of fused-step wall; expected payoff at N=2 is small. Pick after compute-side levers (batch_800, torch_compile) are exhausted."

  - id: tunable_op_live
    description: "BLOCKED on this stack — TunableOp LIVE tuning mode (PYTORCH_TUNABLEOP_TUNING=1) causes GPU memory access faults on MI355X / ROCm 7.2.2 / PyTorch 2.10 with HydraGNN. Use tunable_op_warmup_then_use instead."
    catalog_order: 4
    kind: env_only
    status: "blocked"
    blocked_reason: "GPU-mem-access-fault-during-hipBLASLt-live-tuning"
    blocked_evidence: "loop-c3e4df1c iter-3 (job 7188, 2026-05-22): all 16 GPUs reported 'Memory access fault by GPU node-N' during hipBLASLt kernel autotuning phase; job aborted with signal 6."
    env_vars:
      PYTORCH_TUNABLEOP_ENABLED: "1"
      PYTORCH_TUNABLEOP_TUNING: "1"
      PYTORCH_TUNABLEOP_VERBOSE: "1"
    diagnostic_only: false
    expected_payoff: "none (blocked)"
    risk: "blocked"
    revert_method: "drop_env"
    citation: "https://rocm.docs.amd.com/en/latest/how-to/tuning-guides/mi300x/workload.html"
    notes: "Live tuning racing with training data is unsafe here. Pick tunable_op_warmup_then_use instead, which separates the tuning phase into a dedicated short job."

  - id: tunable_op_warmup_then_use
    description: "2-phase safe TunableOp pattern: a dedicated 1-batch warmup job generates tunableop_results_<N>.csv files, then the actual training job runs with PYTORCH_TUNABLEOP_ENABLED=1 (no _TUNING) to consume the pre-tuned results."
    catalog_order: 4
    kind: rank_script_patch
    env_vars:
      PYTORCH_TUNABLEOP_ENABLED: "1"
      PYTORCH_TUNABLEOP_TUNING: "0"
      PYTORCH_TUNABLEOP_FILENAME: "/shared/aaji/models/HydraGNN/tunableop_results/tunableop_results_%d.csv"
    rank_script_patch: |
      # 2-phase TunableOp pattern.
      #
      # Phase 1 (separate sbatch, NOT this lever) — orchestrator must run
      # this BEFORE picking the lever:
      #   1. mkdir -p /shared/aaji/models/HydraGNN/tunableop_results
      #   2. sbatch with PYTORCH_TUNABLEOP_ENABLED=1 PYTORCH_TUNABLEOP_TUNING=1
      #      PYTORCH_TUNABLEOP_FILENAME=/shared/.../tunableop_results_%d.csv
      #      HG_NUM_EPOCH=1 HYDRAGNN_MAX_NUM_BATCH=5
      #      (short job; expect failure but the per-rank CSVs are written
      #       incrementally as each shape gets tuned, so partial results
      #       are still usable)
      #   3. verify CSVs exist: ls /shared/.../tunableop_results_*.csv
      #
      # Phase 2 (this lever) — the actual training run consumes the CSVs
      # with TUNING=0; if a shape is missing, TunableOp falls back to
      # the default kernel (no fault). No hook code needed beyond the
      # env vars; this stanza is present so the orchestrator can record
      # the 2-phase intent in iter-<N>-lever.json.
      import os
      if int(os.environ.get("SLURM_PROCID", "0")) == 0:
          import glob
          _n_csv = len(glob.glob("/shared/aaji/models/HydraGNN/tunableop_results/tunableop_results_*.csv"))
          print(f"[tunable_op_warmup] consuming {_n_csv} pre-tuned CSV files", flush=True)
    diagnostic_only: false
    expected_payoff: "medium"
    risk: "low"
    revert_method: "drop_env"
    citation: "https://rocm.docs.amd.com/en/latest/how-to/tuning-guides/mi300x/workload.html#tunableop"
    notes: "If the warmup phase did NOT complete (no CSVs), pick a different lever. The orchestrator should add `setup: tunableop_warmup_sbatch` as a precondition before this lever is offered."

  - id: num_workers_12
    description: "DataLoader: HYDRAGNN_NUM_WORKERS 8 -> 12 (persistent_workers already on). Node-class-dependent — helped on a-nodes (-12.4% in loop 43b33ec1), regressed on b-nodes (+10.7% in loop c3e4df1c)."
    catalog_order: 5
    kind: env_only
    env_vars:
      HYDRAGNN_NUM_WORKERS: "12"
    diagnostic_only: false
    expected_payoff: "node-class-dependent"
    risk: "low"
    revert_method: "drop_env"
    citation: "local (loop 43b33ec1 + loop c3e4df1c)"
    notes: "lever_picker should only consider this lever on a-nodes. On b-nodes, num_workers=8 is the sweet spot (verified in iter-2 of loop c3e4df1c with epoch_time=75 s, the current best). If the kernel_correlation.csv from fom_extractor shows dataloader prefetch gaps > 10 ms on b-nodes, try num_workers=10 (not 12)."

  - id: nccl_minchannels
    description: "NCCL_MIN_NCHANNELS=112: forces more channels for collective dispatch, helps when message size is moderate (HydraGNN allreduces are 11.3 MB)."
    catalog_order: 6
    kind: env_only
    env_vars:
      NCCL_MIN_NCHANNELS: "112"
    diagnostic_only: false
    expected_payoff: "low"
    risk: "low"
    revert_method: "drop_env"
    citation: "https://rocm.docs.amd.com/en/docs-7.0.1/how-to/rocm-for-ai/system-setup/multi-node-setup.html"
    notes: "Mostly relevant at N >= 8 nodes. Low priority for the 2-node loop; included for completeness."

  - id: precision_fp32
    description: "HG_PRECISION fp64 -> fp32. gfx950 fp32 MFMA peak (~157 TFLOP/s) is ~2x fp64 (~78.6 TFLOP/s). Numerical floor for MACE-style equivariance."
    catalog_order: 7
    kind: env_only
    env_vars:
      HG_PRECISION: "fp32"
    diagnostic_only: false
    expected_payoff: "medium"
    risk: "medium"
    revert_method: "drop_env"
    citation: "local + gfx950 spec sheet"
    notes: "If the run is still dispatch-bound (mean util < 20%), fp32 wont move the needle much; orchestrator should ONLY pick this lever when fom_extractor reports the most recent best-iter is compute-bound (mfma_tflops > 30% of fp64 peak in best 10-s burst). bf16 is INTENTIONALLY EXCLUDED from this catalog: it breaks equivariance for MACE-class features."

  - id: kernel_trace_diag_only
    description: "DIAGNOSTIC: enable OMNISTAT_KERNEL_TRACE=1 for ONE iteration to capture per-kernel-name dispatch counts/durations. Fires only when the 1-s TraceLens<->Omnistat correlation cannot attribute the dominant kernel."
    catalog_order: 8
    kind: diagnostic
    env_vars:
      OMNISTAT_KERNEL_TRACE: "1"
    diagnostic_only: true
    expected_payoff: "n/a (diagnostic)"
    risk: "medium"
    revert_method: "drop_env"
    citation: "../../../../../.cursor/skills/ai4science-studio/SKILL.md#12-three-rocprofiler-sdk-surfaces-pick-the-right-one"
    notes: "Costs ~1000x VictoriaMetrics cardinality vs default. Use only when lever_picker decides per-kernel attribution is needed AND the kernel_correlation.csv from fom_extractor is too coarse. At most 1 of 5 iters."
