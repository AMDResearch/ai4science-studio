<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #555; stroke-width: 1.2; }
    .title { font-weight: bold; font-size: 15px; }
    .label { font-size: 13px; fill: #444; }
    .c { text-anchor: middle; dominant-baseline: central; }
    .edge { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 6 4; }
  </style>

  <!-- Top row -->
  <rect class="box" x="20" y="35" width="120" height="44" rx="6" fill="#f3f4f6"/>
  <text class="c" x="80" y="57" font-size="13">Claude Code</text>
  <rect class="box" x="153" y="35" width="120" height="44" rx="6" fill="#f3f4f6"/>
  <text class="c" x="213" y="57" font-size="13">OpenCode</text>
  <rect class="box" x="287" y="35" width="120" height="44" rx="6" fill="#f3f4f6"/>
  <text class="c" x="347" y="57" font-size="13">HPC Assistant</text>
  <rect class="box" x="420" y="35" width="120" height="44" rx="6" fill="#f3f4f6"/>
