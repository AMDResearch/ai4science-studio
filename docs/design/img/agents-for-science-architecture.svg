  <text class="c" x="606" y="438">Hyperloom</text>

  <rect x="40" y="480" width="640" height="60" rx="6" fill="#fff" stroke="#bbb"/>
  <text class="label" x="55" y="514">Platform</text>
  <rect class="box" x="150" y="490" width="120" height="40" rx="4"/>
  <text class="c" x="210" y="510">ROCm</text>
  <rect class="box" x="282" y="490" width="120" height="40" rx="4"/>
  <text class="c" x="342" y="510">SLURM</text>
  <rect class="box" x="414" y="490" width="120" height="40" rx="4"/>
