  <rect class="box" x="535" y="185" width="85" height="40" rx="4"/>
  <text class="c" x="577" y="205" font-size="13">perf-report</text>
  <rect class="box" x="630" y="185" width="85" height="40" rx="4"/>
  <text class="c" x="672" y="205" font-size="13">ORBIT-2</text>
  <rect class="box" x="725" y="185" width="85" height="40" rx="4"/>
  <text class="c" x="767" y="205" font-size="13">HydraGNN</text>
  <rect class="box" x="820" y="185" width="85" height="40" rx="4"/>
  <text class="c" x="862" y="205">&#8230;</text>

