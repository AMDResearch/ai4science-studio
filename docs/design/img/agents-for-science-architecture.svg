  <!-- Edges -->
  <path class="edge" d="M480,79 L480,118"/>
  <path class="edge" d="M200,175 L288,195"/>
  <path class="edge" d="M200,230 L288,212"/>
  <path class="edge" d="M520,202 L452,202"/>
  <path class="edge" d="M370,225 L370,266"/>
  <path class="edge" d="M360,328 L360,406"/>
  <path class="edge dashed" d="M430,225 L430,258 L810,258 L810,406"/>
  <text class="label" x="820" y="360">Agents only</text>

  <!-- Legend -->
  <rect class="box dashed" x="40" y="646" width="28" height="16" rx="3"/>
  <text class="label" x="76" y="659">Phase 2 or later</text>
