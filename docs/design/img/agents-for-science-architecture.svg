  <rect class="box" x="820" y="35" width="120" height="44" rx="6" fill="#f3f4f6"/>
  <text class="c" x="880" y="57">&#8230;</text>

  <!-- AI4S Studio -->
  <rect x="20" y="120" width="920" height="220" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
