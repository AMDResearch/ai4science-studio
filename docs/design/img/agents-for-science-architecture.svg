  <rect x="700" y="408" width="220" height="132" rx="6" fill="#fff7e6" stroke="#d48806"/>
  <text class="label" x="715" y="426">LLM service</text>
  <rect class="box dashed" x="725" y="434" width="170" height="28" rx="4"/>
  <text class="c" x="810" y="448">Model router</text>
  <rect class="box" x="725" y="468" width="170" height="28" rx="4"/>
  <text class="c" x="810" y="482">LiteLLM</text>
  <rect class="box" x="725" y="502" width="80" height="28" rx="4"/>
  <text class="c" x="765" y="516">vLLM</text>
  <rect class="box dashed" x="815" y="502" width="80" height="28" rx="4"/>
