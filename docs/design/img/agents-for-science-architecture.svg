  <path class="edge" d="M200,168 L288,215"/>
  <path class="edge" d="M200,214 L288,228"/>
  <path class="edge" d="M200,260 L288,242"/>
  <path class="edge" d="M370,181 L370,198"/>
  <path class="edge" d="M520,227 L452,227"/>
