  <rect class="box" x="40" y="155" width="160" height="40" rx="4"/>
  <text class="c" x="120" y="175">CLI</text>
  <rect class="box" x="40" y="210" width="160" height="40" rx="4"/>
  <text class="c" x="120" y="230">MCP server</text>
  <rect class="box" x="290" y="180" width="160" height="45" rx="4" stroke="#3b6fd4" stroke-width="2"/>
