# AI4Science Studio — Local Cluster Configuration
#
# Copy this file to one of these locations (checked in order):
#   1. .cluster-config.yaml        (this repo — gitignored, per-checkout)
#   2. ~/.config/ai4science-studio/cluster.yaml  (user-level, shared across clones)
#
# The agent (Claude Code / Cursor) reads this file to avoid repeatedly asking
# for cluster-specific details. It is auto-created on first run if missing.
# Update it whenever your cluster environment changes.

# SLURM settings
slurm:
  partition: ""          # e.g. "gpu", "mi300x", "batch"
  account: ""            # e.g. "myproject", "CSC000"
  qos: ""                # optional QoS if your site requires it

# Filesystem paths
paths:
  home: ""               # leave blank to use $HOME; set if non-standard
  scratch: ""            # e.g. "/scratch/$USER", "/lustre/scratch/$USER"
  projects: ""           # e.g. "/projects/myteam"
  sif_cache: ""          # where .sif files are stored (e.g. "$HOME/containers")

# Container runtime
containers:
  runtime: ""            # "apptainer" or "docker"
  gpu_method: ""         # "amd-toolkit" (--runtime=amd) or "device-passthrough" (/dev/kfd)

# ROCm / GPU details
gpu:
  architecture: ""       # e.g. "gfx942" (MI300X), "gfx90a" (MI250X), "gfx950" (MI350X)
  count_per_node: 8      # GPUs per node
  vram_gb: 192           # per-GPU VRAM in GB

# Network
network:
  internet_access: true  # can compute nodes reach the internet?
  proxy: ""              # HTTP proxy if required (e.g. "http://proxy:8080")
  mgmt_iface: ""         # Management NIC for MPI/OOB (discover: ip -o link show up)
  ib_hca: ""             # IB HCA device list for RCCL (discover: ibstat | grep 'CA ')
  rccl_anp_plugin: ""    # Path to librccl-anp.so on host (default: /opt/rocm/lib/librccl-anp.so)
  libionic_path: ""      # Path to libionic.so.1 on host (default: /usr/lib/x86_64-linux-gnu/libionic.so.1)

# OmniHub integration (sibling repo — see integrations/omnihub/README.md)
omnihub:
  repo_dir: ""             # e.g. /home/$USER/git/omnihub
  cluster: vultr           # maps to omnihub config/vultr.yaml on Lux
  shared_dir: /shared/omnihub
  results_dir: ""          # default: /shared/$USER/results/omnihub
  rocm_version: "7.2.2"
