name: PanguWeather
hf_id: N/A
license: CC-BY-NC-SA-4.0
task: Transformer-based deterministic global weather forecasting at 0.25°
domain: earth_science
upstream_code: https://github.com/198808xc/Pangu-Weather
paper: https://www.nature.com/articles/s41586-023-06185-3
container_image: jaxweather:latest
vram_gb: 192
validated_hardware:
  - MI300X

recipes:
  - task: inference
    description: Run 1–7 day deterministic forecasts from CDS initial conditions
    recipe_path: recipes/inference/
    script: examples/run_inference.sh

env_vars:
  CDSAPI_KEY:
    description: Copernicus CDS API key (set in env_file)
    required: true
    default: null
  DATE:
    description: Forecast start date (YYYYMMDD)
    required: false
    default: yesterday
  TIME:
    description: Forecast start time (HHMM)
    required: false
    default: "0000"
  LEAD_TIME:
    description: Forecast horizon in hours (max ~168 = 7 days)
    required: false
    default: "24"
  CACHE_DIR:
    description: Host path for ERA5 data cache
    required: false
    default: /tmp/earthkit-cache
  AI_SAMPLES_DIR:
    description: Where to clone silogen/ai-samples
    required: false
    default: null
