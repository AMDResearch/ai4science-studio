# ORBIT-2 synthetic training template for Studio render_orbit2_config.py.
# Same architecture/data as interm_8m_synthetic.yaml; placeholders for per-job caps.
#
# Set ORBIT2_CONFIG_TEMPLATE=interm_8m_synthetic_train.yaml and
# ORBIT2_SYNTH_DATA_ROOT to the parent of low_res/ and high_res/.

#-----------   TRAINER -------------
trainer:
  max_epochs: __MAX_EPOCHS__
  checkpoint:
  pretrain:
  batch_size: __BATCH_SIZE__
  buffer_size: 4
  num_workers: 0
  data_type: __DATA_TYPE__
  gpu_type: "amd"
  train_loss: "bayesian_tv"

#----------  Parallelism -------------
parallelism:
  fsdp: __FSDP__
  simple_ddp: __SIMPLE_DDP__
  tensor_par: 1
  seq_par: 1

### Tiling
tiling:
  do_tiling: False
  div: 1
  overlap: 0

# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  lr: 2e-3
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 1
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 4
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 4
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

# ---------------------------- DATA -------------------------------------------
data:
  low_res_dir: {
    'SYNTH': "__SYNTH_DATA_DIR__/low_res",
  }
  high_res_dir: {
    'SYNTH': "__SYNTH_DATA_DIR__/high_res",
  }

  spatial_resolution: {
    'SYNTH': 18,
  }

  default_vars: [
    "land_sea_mask",
    "orography",
    "lattitude",
    "landcover",
    "2m_temperature",
    "2m_temperature_max",
    "2m_temperature_min",
    "temperature_200",
    "temperature_500",
    "temperature_850",
    "10m_u_component_of_wind",
    "u_component_of_wind_200",
    "u_component_of_wind_500",
    "u_component_of_wind_850",
    "10m_v_component_of_wind",
    "v_component_of_wind_200",
    "v_component_of_wind_500",
    "v_component_of_wind_850",
    "specific_humidity_200",
    "specific_humidity_500",
    "specific_humidity_850",
    "total_precipitation_24hr",
    "volumetric_soil_water_layer_1",
  ]

  dict_in_variables: {
    'SYNTH': [
      "land_sea_mask",
      "orography",
      "lattitude",
      "landcover",
      "total_precipitation_24hr",
      "2m_temperature_min",
      "2m_temperature_max",
    ],
  }

  dict_out_variables: {
    'SYNTH': [
      "total_precipitation_24hr",
      "2m_temperature_min",
      "2m_temperature_max",
    ],
  }

  var_weights: {
    "2m_temperature": 10,
    "10m_u_component_of_wind": 1,
    "10m_v_component_of_wind": 1,
    "total_precipitation_24hr": 1,
    "2m_temperature_min": 10,
    "2m_temperature_max": 10,
  }
