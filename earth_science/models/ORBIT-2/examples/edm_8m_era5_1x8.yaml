# Bayes-CAST `edm_8m_era5.yaml` — Studio copy for 1 node × 8 GPUs.
# Source of truth upstream: `bayes-cast/configs/edm_8m_era5.yaml` beside this repo (sync when Bayes-CAST updates).
# Set ORBIT2_ROOT to your Bayes-CAST checkout (must include `preset: edm` + EDM training stack).
# Parallelism is rendered to **fsdp=8, simple_ddp=1** for 8 ranks on one node.
# `__DATA_ROOT__` → ORBIT2_DATA_ROOT (e.g. .../era5/1.0_deg). `__ERA5_1_SPATIAL_RES__` → ORBIT2_ERA5_SPATIAL_RES (default 111).
#
#-----------   TRAINER  -------------------------------------------------------
trainer:
  max_epochs: __MAX_EPOCHS__
  checkpoint: 
  pretrain: 
  batch_size: __BATCH_SIZE__
  buffer_size: 200
  num_workers: __NUM_WORKERS__
  data_type: __DATA_TYPE__
  gpu_type: "amd" #amd or nvidia or leave it empty
  train_loss: "mse"

#----------  Parallelism and Efficient Computing -------------------------------
parallelism:
  fsdp: __FSDP__
  simple_ddp: __SIMPLE_DDP__
  tensor_par: 1
  seq_par: 1


### Tiling
tiling:
  do_tiling: True
  div: 2
  overlap: 18

###Reslim Input Data Compression
compression:
  compress_ratio: 1


#------------   EDM Specific Hyperparameters -----------------------------------
EDM_hyper:
  sigma_data:  1  
  weight_mode:  
 
# ---------------------------- MODEL -------------------------------------------
model:
  preset: edm
  lr: 2e-4
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 2
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  patch_size: 6
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 8
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

# ---------------------------- DATA -------------------------------------------
