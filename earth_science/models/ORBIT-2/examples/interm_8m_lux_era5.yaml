# ORBIT-2 Lux/MI355X — ERA5 1.0_deg sanity / pipeline test (same-dir mode).
#
# Both low_res_dir and high_res_dir point at the same ERA5 tree so we can verify
# the new dataset loads and training runs before pairing with PRISM 2.5_arcmin targets.
# Loss is not scientifically meaningful in same-dir mode — use for data/pipeline sanity only.
#
# Placeholders substituted by render_orbit2_config.py:
#   __DATA_ROOT__   — ORBIT2_DATA_ROOT (era5/1.0_deg directory)
#   __FSDP__        — fsdp parallelism (typically = node count)
#   __SIMPLE_DDP__  — simple_ddp parallelism (typically 8)
#   __MAX_EPOCHS__  — ORBIT2_MAX_EPOCH override
#   __BATCH_SIZE__  — ORBIT2_BATCH_SIZE override
#   __DATA_TYPE__   — ORBIT2_DATA_TYPE (matches upstream training dtype: public ORBIT-2
#                     `configs/interm_8m.yaml` uses bfloat16; Bayes-CAST-style trees often
#                     ship `edm_8m_era5.yaml` with the same. Studio sbatch defaults bfloat16.)

#-----------   TRAINER -------------
trainer:
  max_epochs: __MAX_EPOCHS__
  checkpoint:
  pretrain:
  batch_size: __BATCH_SIZE__
  buffer_size: 40
  num_workers: 0
  data_type: __DATA_TYPE__
  gpu_type: "amd"
  train_loss: "bayesian_tv"

#----------  Parallelism -------------
parallelism:
  fsdp: __FSDP__
  simple_ddp: __SIMPLE_DDP__
  tensor_par: 1
  seq_par: 1

### Tiling
tiling:
  do_tiling: False
  div: 4
  overlap: 3

# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  lr: 2e-3
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 1
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 1
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 4
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

# ---------------------------- DATA -------------------------------------------
data:
  low_res_dir: {
    'ERA5_2': "__DATA_ROOT__",
  }
  high_res_dir: {
    'ERA5_2': "__DATA_ROOT__",
  }

  spatial_resolution: {
    'ERA5_2': 111,
  }

  default_vars: [
    "land_sea_mask",
    "orography",
    "lattitude",
    "landcover",
    "2m_temperature",
    "2m_temperature_max",
    "2m_temperature_min",
    "temperature_200",
    "temperature_500",
    "temperature_850",
    "10m_u_component_of_wind",
    "u_component_of_wind_200",
    "u_component_of_wind_500",
    "u_component_of_wind_850",
    "10m_v_component_of_wind",
    "v_component_of_wind_200",
    "v_component_of_wind_500",
    "v_component_of_wind_850",
    "specific_humidity_200",
    "specific_humidity_500",
    "specific_humidity_850",
    "total_precipitation_24hr",
    "volumetric_soil_water_layer_1",
  ]

  dict_in_variables: {
    'ERA5_2': [
      "land_sea_mask",
      "orography",
      "lattitude",
      "landcover",
      "2m_temperature",
      "2m_temperature_max",
      "2m_temperature_min",
      "temperature_200",
      "temperature_500",
      "temperature_850",
      "10m_u_component_of_wind",
      "u_component_of_wind_200",
      "u_component_of_wind_500",
      "u_component_of_wind_850",
      "10m_v_component_of_wind",
      "v_component_of_wind_200",
      "v_component_of_wind_500",
      "v_component_of_wind_850",
      "specific_humidity_200",
      "specific_humidity_500",
      "specific_humidity_850",
      "total_precipitation_24hr",
      "volumetric_soil_water_layer_1",
    ],
  }

  dict_out_variables: {
    'ERA5_2': [
      "total_precipitation_24hr",
      "2m_temperature_min",
      "2m_temperature_max",
    ],
  }

  var_weights: {
    "2m_temperature": 10,
    "10m_u_component_of_wind": 1,
    "10m_v_component_of_wind": 1,
    "total_precipitation_24hr": 1,
    "2m_temperature_min": 10,
    "2m_temperature_max": 10,
  }
